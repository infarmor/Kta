name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    # The analyzer is plain Python and needs no iPhone, so it runs on Linux. 3.9 is the python3 Apple ships
    # with the Command Line Tools; setup-python has no 3.9 build for Ubuntu 26.04, hence the pinned runner.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q tests
