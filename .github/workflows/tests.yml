name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    # The analyzer is plain Python and needs no iPhone, so it runs on Linux.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q tests
